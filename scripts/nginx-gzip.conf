# Chada Digital — nginx gzip configuration snippet
# Install via scripts/enable-gzip-on-nginx.sh (one-time setup).
#
# After installation, this snippet is included from /etc/nginx/conf.d/chada-gzip.conf
# which nginx auto-includes in its http {} block on Ubuntu/Debian.

gzip on;
gzip_static on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_disable "msie6";
gzip_proxied any;

gzip_types
    text/css
    text/plain
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    font/woff
    font/woff2
    application/font-woff
    application/font-woff2;
